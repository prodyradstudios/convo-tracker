[project]
name = "convo-tracker-backend"
version = "0.1.0"
description = "Convo Tracker backend: speaker enrollment, identification and live transcription"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::DeprecationWarning:speechbrain.*",
]
